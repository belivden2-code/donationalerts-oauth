<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DonationAlerts OAuth</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #171717;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(720px, calc(100% - 32px));
      padding: 28px;
      box-sizing: border-box;
      border: 1px solid #444;
      border-radius: 14px;
      background: #222;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    #status {
      margin: 18px 0;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      box-sizing: border-box;
      padding: 12px;
      resize: vertical;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      color: #eee;
      font: 13px/1.45 monospace;
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #ff9800;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .warning {
      color: #ffb15c;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>DonationAlerts OAuth</h1>

    <p id="intro">
      Эта страница принимает access token, который DonationAlerts
      возвращает после OAuth-авторизации.
    </p>

    <div id="status">Проверяю ответ от DonationAlerts...</div>

    <section id="result" class="hidden">
      <p class="warning">
        Не отправляй этот токен другим людям и не публикуй его в открытом доступе.
      </p>

      <textarea id="token" readonly></textarea>

      <button id="copy">Скопировать токен</button>
    </section>
  </main>

  <script>
    (() => {
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const tokenBox = document.getElementById('token');
      const copyButton = document.getElementById('copy');

      const hash = new URLSearchParams(
        window.location.hash.replace(/^#/, '')
      );

      const accessToken = hash.get('access_token');
      const error = hash.get('error');
      const errorDescription = hash.get('error_description');

      if (accessToken) {
        status.textContent = 'Авторизация успешна. Access token получен.';
        result.classList.remove('hidden');
        tokenBox.value = accessToken;

        // Убираем токен из адресной строки после чтения.
        history.replaceState(
          null,
          document.title,
          window.location.pathname + window.location.search
        );

        copyButton.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(accessToken);
            copyButton.textContent = 'Скопировано';
            setTimeout(() => {
              copyButton.textContent = 'Скопировать токен';
            }, 1800);
          } catch {
            tokenBox.focus();
            tokenBox.select();
            document.execCommand('copy');
            copyButton.textContent = 'Скопировано';
          }
        });

        return;
      }

      if (error) {
        status.textContent =
          'DonationAlerts вернул ошибку: ' +
          error +
          (errorDescription ? ' — ' + errorDescription : '');
        return;
      }

      status.textContent =
        'Страница готова. Теперь запусти OAuth-ссылку DonationAlerts.';
    })();
  </script>
</body>
</html>
